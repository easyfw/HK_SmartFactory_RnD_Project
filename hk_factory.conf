# HK Smart Factory Configuration
# Production line settings for Hong Kong facility

[factory]
facility_name = HK Manufacturing Facility
location = Hong Kong
shift_duration_hours = 8

[line_a]
name = Assembly Line A
stations = 3
target_rate = 500

[line_b]
name = Packaging Line B
stations = 2
target_rate = 300

[quality]
inspection_interval = 10
defect_threshold = 0.05

[logging]
save_reports = true
report_directory = production_data
